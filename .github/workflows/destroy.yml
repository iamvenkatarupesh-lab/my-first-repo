name: Destroy ECS stack

# Manual-only. Runs scripts/teardown.sh in GitHub Actions so you don't need
# AWS CLI on your laptop. Requires you to type CONFIRM to prevent accidents.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DESTROY to confirm deletion'
        required: true
        type: string

jobs:
  destroy:
    if: ${{ inputs.confirm == 'DESTROY' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Run teardown
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          chmod +x scripts/teardown.sh
          ./scripts/teardown.sh
